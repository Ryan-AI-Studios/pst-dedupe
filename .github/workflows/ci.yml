# Windows-only CI for pst-dedupe.
# Adapted from Ledgerful's hygiene gates (fmt / clippy / test) without multi-OS
# or Ledgerful product-specific jobs (web SPA, nextest tiers).
# Track 0062 adds cargo-audit + cargo-deny (licenses / advisories / sources).
#
# Action Node runtimes: prefer actions that natively target Node.js 24
# (Node 20 is deprecated on GitHub-hosted runners).
# See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: fmt
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      # v5+ runs on Node.js 24 (v4 targeted Node 20 — deprecated).
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # v2.9+ migrates the action runtime to Node.js 24.
      - uses: Swatinem/rust-cache@v2.9.1
      - name: cargo fmt
        run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.1
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: cargo test
        run: cargo test --workspace

  audit:
    name: audit
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        # Uses .cargo/audit.toml ignores (documented D-0062-audit-* residuals).
        run: cargo audit

  deny:
    name: deny
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.1
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo deny check
        # deny.toml: strict licenses (no GPL/AGPL allow), advisories, crates.io sources only.
        run: cargo deny check

  # 0110 — Leptos CSR frontend (workspace-excluded); host tests stay in `test` job.
  chrome-ui:
    name: chrome-ui
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: crates/dedupe-chrome/ui
      - name: Install trunk
        run: cargo install trunk --locked --version 0.21.14
      - name: trunk build (dedupe-chrome-ui)
        working-directory: crates/dedupe-chrome/ui
        run: trunk build --release --config Trunk.toml
      - name: cargo test -p dedupe-chrome (host)
        run: cargo test -p dedupe-chrome
      - name: cargo test chrome-ui (host)
        run: cargo test --manifest-path crates/dedupe-chrome/ui/Cargo.toml

  # Mirrors local `ledgerful verify` steps when ledgerful is not available in CI.
  # Local pre-push runs: ledgerful verify --scope fast (which uses the same steps).
  verify-parity:
    name: verify-parity
    runs-on: windows-latest
    needs: [fmt, clippy, test, audit, deny, chrome-ui]
    timeout-minutes: 5
    steps:
      - name: Gate summary
        run: |
          Write-Host "fmt + clippy + test + audit + deny + chrome-ui matched track 0062/0110 gates"
          Write-Host "Local pre-push additionally runs: ledgerful verify --scope fast"
          Write-Host "Local pre-commit runs: ledgerful ledger status + scripts/pre-commit.ps1"
