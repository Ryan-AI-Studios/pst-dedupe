[package]
name = "dedupe-desk"
version = "0.2.0-rc.1"
edition = "2021"
description = "Dedupe Desk — single-exe matter / sources / process shell"
license = "LicenseRef-Proprietary"
license-file = "../../LICENSE"

[[bin]]
name = "dedupe-desk"
path = "src/main.rs"

[dependencies]
process-runner = { path = "../process-runner" }
matter-core = { path = "../matter-core" }
matter-qc = { path = "../matter-qc" }
matter-gap = { path = "../matter-gap" }
matter-search = { path = "../matter-search" }
matter-semantic = { path = "../matter-semantic" }
matter-ai = { path = "../matter-ai" }
eframe = { workspace = true }
rfd = { workspace = true }
camino = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
# Progress bus watch + optional Connect network helpers (0064).
tokio = { version = "1", default-features = false, features = ["sync", "rt-multi-thread", "macros", "time"] }
# matter-service Connect client (track 0064) — workspace pin, rustls.
reqwest = { workspace = true }
zeroize = { workspace = true }
url = "2"

[dev-dependencies]
tempfile = { workspace = true }
