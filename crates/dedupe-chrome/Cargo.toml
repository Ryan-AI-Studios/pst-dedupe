[package]
name = "dedupe-chrome"
version = "0.2.0-rc.1"
edition = "2021"
description = "Dedupe Desk — Tauri 2 + Leptos matter chrome"
license = "LicenseRef-Proprietary"
license-file = "../../LICENSE"

[[bin]]
name = "dedupe-chrome"
path = "src/main.rs"

[lib]
name = "dedupe_chrome_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
matter-core = { path = "../matter-core" }
matter-search = { path = "../matter-search" }
camino = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
dirs = "6"
percent-encoding = "2"

[dev-dependencies]
tempfile = { workspace = true }
